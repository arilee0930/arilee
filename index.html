<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>arilee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background-color: #fafafa;
      word-break: keep-all;
      overflow-wrap: break-word;
      letter-spacing: -0.015em;
    }
    .cal-cell {
      min-height: 90px;
    }
  </style>
</head>
<body class="text-neutral-800 min-h-screen pb-20">

  <!-- 상단 헤더 -->
  <header class="max-w-4xl mx-auto pt-12 pb-6 px-6 flex justify-between items-center border-b border-neutral-200">
    <h1 class="text-sm font-bold tracking-wider text-neutral-800 lowercase">arilee</h1>
    
    <div class="flex items-center gap-2">
      <!-- 검색 토글 -->
      <div class="relative flex items-center">
        <input 
          type="text" 
          id="search-input" 
          oninput="handleFilterAndSort()" 
          placeholder="제목 검색..." 
          class="w-0 opacity-0 transition-all duration-300 pr-2 pl-7 py-1 text-xs bg-white border border-neutral-200 rounded-full outline-none focus:border-neutral-800"
        />
        <button onclick="toggleSearchInput()" class="p-1.5 text-neutral-500 hover:text-neutral-900 absolute left-0" title="검색">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
      </div>

      <!-- 새 기록 작성 버튼 -->
      <button onclick="openCreateModal()" class="w-6 h-6 flex items-center justify-center bg-neutral-900 text-white rounded-full hover:bg-neutral-700 transition text-sm leading-none pb-0.5" title="새 기록">
        +
      </button>
    </div>
  </header>

  <!-- 카테고리 필터 & 뷰 모드 컨트롤 -->
  <div class="max-w-4xl mx-auto px-6 pt-5 pb-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <nav class="flex gap-2 overflow-x-auto text-xs w-full sm:w-auto pb-1 sm:pb-0">
      <button onclick="changeCategory('전체')" class="filter-btn active px-3 py-1.5 rounded-full border border-neutral-900 bg-neutral-900 text-white">전체</button>
      <button onclick="changeCategory('책')" class="filter-btn px-3 py-1.5 rounded-full border border-neutral-200 bg-white text-neutral-600 hover:border-neutral-400">책</button>
      <button onclick="changeCategory('영화')" class="filter-btn px-3 py-1.5 rounded-full border border-neutral-200 bg-white text-neutral-600 hover:border-neutral-400">영화</button>
      <button onclick="changeCategory('시리즈')" class="filter-btn px-3 py-1.5 rounded-full border border-neutral-200 bg-white text-neutral-600 hover:border-neutral-400">시리즈</button>
      <button onclick="changeCategory('전시')" class="filter-btn px-3 py-1.5 rounded-full border border-neutral-200 bg-white text-neutral-600 hover:border-neutral-400">전시</button>
      <button onclick="changeCategory('공연')" class="filter-btn px-3 py-1.5 rounded-full border border-neutral-200 bg-white text-neutral-600 hover:border-neutral-400">공연</button>
    </nav>

    <div class="flex items-center gap-3 self-end sm:self-auto">
      <div class="flex border border-neutral-200 rounded-lg p-0.5 bg-white">
        <button id="view-btn-grid" onclick="setViewMode('grid')" class="p-1.5 rounded text-neutral-800 bg-neutral-100" title="갤러리 뷰">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        </button>
        <button id="view-btn-calendar" onclick="setViewMode('calendar')" class="p-1.5 rounded text-neutral-400 hover:text-neutral-800" title="캘린더 뷰">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </button>
      </div>

      <div id="sort-wrapper" class="flex items-center gap-1.5">
        <select id="sort-select" onchange="handleFilterAndSort()" class="bg-white border border-neutral-200 rounded-lg px-2 py-1 text-xs outline-none focus:border-neutral-800 text-neutral-600">
          <option value="latest">최신순</option>
          <option value="oldest">과거순</option>
          <option value="rating-high">별점 높은순</option>
          <option value="rating-low">별점 낮은순</option>
          <option value="title-asc">가나다순</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 메인 피드 -->
  <main class="max-w-4xl mx-auto px-6 pt-4">
    <!-- 그리드 뷰 -->
    <div id="cards-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>

    <!-- 캘린더 뷰 -->
    <div id="calendar-view" class="hidden bg-white border border-neutral-200/80 rounded-2xl p-5 shadow-sm">
      <div class="flex justify-between items-center mb-4 px-2">
        <h2 id="calendar-month-year" class="text-sm font-semibold text-neutral-800"></h2>
        <div class="flex gap-1">
          <button onclick="changeMonth(-1)" class="p-1 rounded hover:bg-neutral-100 text-neutral-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </button>
          <button onclick="changeMonth(0)" class="text-[11px] px-2 py-1 rounded hover:bg-neutral-100 text-neutral-600 font-medium">오늘</button>
          <button onclick="changeMonth(1)" class="p-1 rounded hover:bg-neutral-100 text-neutral-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-medium text-neutral-400 mb-1">
        <div class="text-red-400">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div>토</div>
      </div>

      <div id="calendar-days" class="grid grid-cols-7 gap-1"></div>
    </div>
  </main>

  <!-- 상세 보기 모달 -->
  <div id="detail-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-xs sm:max-w-sm w-full p-5 shadow-xl border border-neutral-100 relative">
      <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-neutral-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      <div id="detail-content" class="text-xs"></div>
    </div>
  </div>

  <!-- 작성 / 수정 모달 -->
  <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-neutral-100 my-8">
      <h2 id="modal-title" class="text-sm font-semibold mb-4 text-neutral-900">새 기록 작성</h2>
      
      <form id="record-form" class="space-y-3.5 text-xs">
        <input type="hidden" id="edit-id" value="">

        <div>
          <label class="block text-neutral-500 mb-1">포스터/표지 이미지</label>
          <div 
            id="paste-area" 
            onclick="document.getElementById('input-file').click()"
            class="relative w-full aspect-[3/4] border-2 border-dashed border-neutral-200 rounded-xl flex flex-col items-center justify-center text-neutral-400 hover:border-neutral-400 hover:text-neutral-600 cursor-pointer overflow-hidden bg-neutral-50"
          >
            <input type="file" id="input-file" accept="image/*" class="hidden" onchange="handleFileSelect(this)">
            <img id="preview-image" src="" alt="미리보기" class="w-full h-full object-cover hidden">
            
            <div id="upload-placeholder" class="text-center p-4">
              <svg class="w-6 h-6 mx-auto mb-2 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
              <p class="text-[11px] leading-relaxed">
                클릭하여 파일 선택<br>
                또는 복사 후 <span class="font-semibold text-neutral-700">Cmd+V</span>
              </p>
            </div>
          </div>
          <input type="hidden" id="input-imageData">
        </div>

        <div>
          <label class="block text-neutral-500 mb-1">카테고리</label>
          <select id="input-category" class="w-full border border-neutral-200 rounded-lg p-2 outline-none focus:border-neutral-800 bg-white">
            <option value="영화">영화</option>
            <option value="시리즈">시리즈</option>
            <option value="책">책</option>
            <option value="전시">전시</option>
            <option value="공연">공연</option>
          </select>
        </div>

        <div>
          <label class="block text-neutral-500 mb-1">제목</label>
          <input type="text" id="input-title" placeholder="제목을 입력하세요" required class="w-full border border-neutral-200 rounded-lg p-2 outline-none focus:border-neutral-800" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-neutral-500 mb-1">본 날짜</label>
            <input type="date" id="input-date" required class="w-full border border-neutral-200 rounded-lg p-2 outline-none focus:border-neutral-800 bg-white" />
          </div>
          <div>
            <label class="block text-neutral-500 mb-1">별점</label>
            <select id="input-rating" class="w-full border border-neutral-200 rounded-lg p-2 outline-none focus:border-neutral-800 bg-white text-amber-500 font-serif">
              <option value="5">★★★★★</option>
              <option value="4">★★★★☆</option>
              <option value="3">★★★☆☆</option>
              <option value="2">★★☆☆☆</option>
              <option value="1">★☆☆☆☆</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-neutral-500 mb-1">메모</label>
          <textarea id="input-comment" rows="3" placeholder="감상이나 메모를 남겨보세요" class="w-full border border-neutral-200 rounded-lg p-2 outline-none focus:border-neutral-800 resize-none leading-relaxed"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-3 py-2 text-neutral-400 hover:text-neutral-700">취소</button>
          <button type="submit" id="submit-btn" class="bg-neutral-900 text-white px-4 py-2 rounded-lg hover:bg-neutral-700 font-medium">완료</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 하단 백업 및 복원 -->
  <footer class="max-w-4xl mx-auto px-6 mt-16 pt-6 border-t border-neutral-200/60 flex justify-end items-center text-[11px] text-neutral-400 gap-3">
    <button onclick="exportData()" class="hover:text-neutral-800 transition underline underline-offset-2">
      데이터 백업
    </button>
    <span>•</span>
    <label class="hover:text-neutral-800 transition underline underline-offset-2 cursor-pointer">
      데이터 복원
      <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(this)">
    </label>
  </footer>

  <!-- Firebase 및 메인 로직 스크립트 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2Khungaq6leXSLKyGqS169iad0-kBQvQ",
      authDomain: "arilee-5797e.firebaseapp.com",
      projectId: "arilee-5797e",
      storageBucket: "arilee-5797e.firebasestorage.app",
      messagingSenderId: "442713986797",
      appId: "1:442713986797:web:c6b9e632d31ccf27e21ee4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const recordsCol = collection(db, "records");

    let records = [];
    let currentCategory = '전체';
    let isSearchOpen = false;
    let currentView = 'grid';
    let calendarDate = new Date();

    // Firestore 실시간 동기화 감지
    onSnapshot(recordsCol, (snapshot) => {
      records = [];
      snapshot.forEach((docSnap) => {
        records.push(docSnap.data());
      });
      handleFilterAndSort();
    }, (error) => {
      console.error("데이터 동기화 실패:", error);
      alert("데이터베이스 연결에 문제가 발생했습니다. 파이어베이스 규칙을 확인해주세요.");
    });

    // 폼 저장 (생성/수정)
    document.getElementById('record-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = '저장 중...';

      const editId = document.getElementById('edit-id').value;
      const id = editId ? Number(editId) : Date.now();

      const recordData = {
        id: id,
        category: document.getElementById('input-category').value,
        title: document.getElementById('input-title').value,
        date: document.getElementById('input-date').value,
        rating: document.getElementById('input-rating').value,
        comment: document.getElementById('input-comment').value,
        image: document.getElementById('input-imageData').value
      };

      try {
        await setDoc(doc(db, "records", String(id)), recordData);
        closeModal();
      } catch (err) {
        console.error(err);
        alert('저장에 실패했습니다. 관리자 설정을 확인하세요.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '완료';
      }
    });

    // 삭제 기능
    window.deleteRecord = async function(id) {
      if (!confirm('이 기록을 삭제할까요?')) return;
      try {
        await deleteDoc(doc(db, "records", String(id)));
        closeDetailModal();
      } catch (err) {
        console.error(err);
        alert('삭제에 실패했습니다.');
      }
    };

    // 데이터 백업 (JSON 다운로드)
    window.exportData = function() {
      if (records.length === 0) {
        alert('백업할 기록이 없습니다.');
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records));
      const downloadAnchor = document.createElement('a');
      const today = getTodayString();
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `arilee_backup_${today}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    // 데이터 복원 (JSON 업로드 후 Firestore에 일괄 저장)
    window.importData = function(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            if (confirm(`백업 파일의 ${imported.length}개 기록을 데이터베이스로 복원하시겠습니까?`)) {
              for (const item of imported) {
                const docId = String(item.id || Date.now() + Math.random());
                await setDoc(doc(db, "records", docId), item);
              }
              alert('복원이 완료되었습니다.');
            }
          } else {
            alert('올바른 백업 파일 형식이 아닙니다.');
          }
        } catch (err) {
          console.error(err);
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
      input.value = '';
    };

    // UI 제어 함수 바인딩
    window.setViewMode = function(mode) {
      currentView = mode;
      const gridBtn = document.getElementById('view-btn-grid');
      const calBtn = document.getElementById('view-btn-calendar');
      const gridEl = document.getElementById('cards-grid');
      const calEl = document.getElementById('calendar-view');
      const sortWrapper = document.getElementById('sort-wrapper');

      if (mode === 'grid') {
        gridBtn.className = "p-1.5 rounded text-neutral-800 bg-neutral-100";
        calBtn.className = "p-1.5 rounded text-neutral-400 hover:text-neutral-800";
        gridEl.classList.remove('hidden');
        calEl.classList.add('hidden');
        sortWrapper.classList.remove('hidden');
      } else {
        calBtn.className = "p-1.5 rounded text-neutral-800 bg-neutral-100";
        gridBtn.className = "p-1.5 rounded text-neutral-400 hover:text-neutral-800";
        gridEl.classList.add('hidden');
        calEl.classList.remove('hidden');
        sortWrapper.classList.add('hidden');
      }
      handleFilterAndSort();
    };

    window.changeMonth = function(delta) {
      if (delta === 0) {
        calendarDate = new Date();
      } else {
        calendarDate.setMonth(calendarDate.getMonth() + delta);
      }
      renderCalendar(getFilteredData());
    };

    window.toggleSearchInput = function() {
      const input = document.getElementById('search-input');
      isSearchOpen = !isSearchOpen;
      if (isSearchOpen) {
        input.classList.remove('w-0', 'opacity-0');
        input.classList.add('w-44', 'opacity-100');
        input.focus();
      } else {
        if (!input.value) {
          input.classList.add('w-0', 'opacity-0');
          input.classList.remove('w-44', 'opacity-100');
        }
      }
    };

    window.changeCategory = function(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.innerText === cat) {
          btn.className = "filter-btn px-3 py-1.5 rounded-full border border-neutral-900 bg-neutral-900 text-white";
        } else {
          btn.className = "filter-btn px-3 py-1.5 rounded-full border border-neutral-200 bg-white text-neutral-600 hover:border-neutral-400";
        }
      });
      handleFilterAndSort();
    };

    window.handleFilterAndSort = function() {
      const filtered = getFilteredData();

      if (currentView === 'calendar') {
        renderCalendar(filtered);
        return;
      }

      const sortValue = document.getElementById('sort-select').value;
      filtered.sort((a, b) => {
        if (sortValue === 'latest') return new Date(b.date) - new Date(a.date);
        if (sortValue === 'oldest') return new Date(a.date) - new Date(b.date);
        if (sortValue === 'rating-high') return Number(b.rating) - Number(a.rating);
        if (sortValue === 'rating-low') return Number(a.rating) - Number(b.rating);
        if (sortValue === 'title-asc') return a.title.localeCompare(b.title, 'ko');
        return 0;
      });

      renderGrid(filtered);
    };

    function getFilteredData() {
      const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();

      let filtered = currentCategory === '전체' 
        ? [...records] 
        : records.filter(item => item.category === currentCategory);

      if (searchTerm) {
        filtered = filtered.filter(item => item.title.toLowerCase().includes(searchTerm));
      }
      return filtered;
    }

    function renderGrid(dataList) {
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      if (dataList.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-20 text-center text-xs text-neutral-400">
            기록된 항목이 없습니다.
          </div>
        `;
        return;
      }

      dataList.forEach(item => {
        const starText = '★'.repeat(Number(item.rating)) + '☆'.repeat(5 - Number(item.rating));
        const card = document.createElement('article');
        card.className = "group flex flex-col cursor-pointer";
        card.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return;
          openDetailModal(item.id);
        };

        card.innerHTML = `
          <div class="w-full aspect-[3/4] rounded-xl overflow-hidden bg-neutral-100 border border-neutral-200/60 mb-2 relative shadow-sm">
            ${item.image 
              ? `<img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">` 
              : `<div class="w-full h-full flex flex-col items-center justify-center text-neutral-300 p-2 text-center">
                   <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                   <span class="text-[10px]">No Poster</span>
                 </div>`
            }
          </div>

          <div class="px-0.5">
            <div class="flex justify-between items-center mb-0.5">
              <span class="text-[10px] text-neutral-400 font-medium tracking-wide">${item.category}</span>
              <span class="text-amber-500 text-[10px] tracking-tighter">${starText}</span>
            </div>
            <h3 class="text-xs font-semibold text-neutral-900 truncate mb-1" title="${item.title}">${item.title}</h3>
            
            <p class="text-[11px] text-neutral-500 line-clamp-2 leading-relaxed mb-2 min-h-[32px]">${item.comment || ''}</p>
            
            <div class="flex justify-between items-center text-[10px] text-neutral-300">
              <span>${item.date}</span>
              <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                <button onclick="openEditModal(${item.id})" class="text-neutral-400 hover:text-neutral-900">수정</button>
                <button onclick="deleteRecord(${item.id})" class="text-neutral-300 hover:text-red-500">삭제</button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderCalendar(dataList) {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      
      document.getElementById('calendar-month-year').innerText = `${year}년 ${month + 1}월`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();

      const daysContainer = document.getElementById('calendar-days');
      daysContainer.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "cal-cell p-1 rounded-lg bg-neutral-50/50 border border-transparent";
        daysContainer.appendChild(emptyCell);
      }

      const todayStr = getTodayString();

      for (let day = 1; day <= lastDay; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayRecords = dataList.filter(item => item.date === dateStr);
        const isToday = dateStr === todayStr;

        const cell = document.createElement('div');
        cell.className = `cal-cell p-1 rounded-lg border border-neutral-100 bg-white flex flex-col justify-between hover:border-neutral-300 transition ${isToday ? 'ring-1 ring-neutral-800' : ''}`;
        
        let cellHtml = `
          <div class="flex justify-between items-center px-1">
            <span class="text-[11px] font-medium ${isToday ? 'text-neutral-900 font-bold' : 'text-neutral-500'}">${day}</span>
            <button onclick="openCreateModal('${dateStr}')" class="text-[10px] text-neutral-300 hover:text-neutral-700">+</button>
          </div>
          <div class="space-y-1 overflow-y-auto max-h-[85px] mt-1 pr-0.5">
        `;

        dayRecords.forEach(rec => {
          cellHtml += `
            <div onclick="openDetailModal(${rec.id})" class="flex items-center gap-1.5 p-1 bg-neutral-50 hover:bg-neutral-100 rounded border border-neutral-200/60 cursor-pointer transition text-left" title="${rec.title}">
              ${rec.image 
                ? `<img src="${rec.image}" class="w-4 h-5 object-cover rounded flex-shrink-0">` 
                : `<div class="w-4 h-5 bg-neutral-200 rounded flex-shrink-0 flex items-center justify-center text-[8px] text-neutral-400">●</div>`
              }
              <div class="overflow-hidden leading-none">
                <p class="text-[10px] font-medium text-neutral-800 truncate">${rec.title}</p>
                <p class="text-[8px] text-amber-500 font-serif">★${rec.rating}</p>
              </div>
            </div>
          `;
        });

        cellHtml += `</div>`;
        cell.innerHTML = cellHtml;
        daysContainer.appendChild(cell);
      }
    }

    // 모달 관리 함수들
    window.openCreateModal = function(datePreset) {
      document.getElementById('record-form').reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('modal-title').innerText = '새 기록 작성';
      document.getElementById('submit-btn').innerText = '완료';
      document.getElementById('input-imageData').value = '';
      document.getElementById('preview-image').src = '';
      document.getElementById('preview-image').classList.add('hidden');
      document.getElementById('upload-placeholder').classList.remove('hidden');
      document.getElementById('input-date').value = datePreset || getTodayString();
      document.getElementById('modal').classList.remove('hidden');
    };

    window.openEditModal = function(id) {
      const target = records.find(item => item.id === id);
      if (!target) return;

      closeDetailModal();
      document.getElementById('modal-title').innerText = '기록 수정';
      document.getElementById('submit-btn').innerText = '완료';
      document.getElementById('edit-id').value = target.id;
      document.getElementById('input-category').value = target.category;
      document.getElementById('input-title').value = target.title;
      document.getElementById('input-date').value = target.date;
      document.getElementById('input-rating').value = target.rating;
      document.getElementById('input-comment').value = target.comment || '';
      document.getElementById('input-imageData').value = target.image || '';

      if (target.image) {
        setImagePreview(target.image);
      } else {
        document.getElementById('preview-image').src = '';
        document.getElementById('preview-image').classList.add('hidden');
        document.getElementById('upload-placeholder').classList.remove('hidden');
      }

      document.getElementById('modal').classList.remove('hidden');
    };

    window.openDetailModal = function(id) {
      const target = records.find(item => item.id === id);
      if (!target) return;

      const starText = '★'.repeat(Number(target.rating)) + '☆'.repeat(5 - Number(target.rating));
      const container = document.getElementById('detail-content');

      container.innerHTML = `
        <div class="flex flex-col items-center text-center">
          ${target.image 
            ? `<div class="w-28 aspect-[3/4] rounded-lg overflow-hidden border border-neutral-200 mb-3 shadow-sm">
                 <img src="${target.image}" class="w-full h-full object-cover">
               </div>` 
            : ''}
          <span class="text-[10px] text-neutral-400 font-medium tracking-wide mb-0.5">${target.category}</span>
          <h3 class="text-sm font-bold text-neutral-900 mb-1 leading-snug">${target.title}</h3>
          <p class="text-amber-500 text-xs mb-3 font-serif">${starText}</p>
          
          <div class="w-full bg-neutral-50 rounded-xl p-3.5 border border-neutral-100 text-left mb-4">
            <p class="text-[11px] font-medium text-neutral-400 mb-1">메모</p>
            <p class="text-neutral-700 text-xs leading-relaxed whitespace-pre-wrap">${target.comment || '<span class="text-neutral-400">남겨진 메모가 없습니다.</span>'}</p>
          </div>

          <div class="w-full flex justify-between items-center text-[11px] text-neutral-400 pt-2 border-t border-neutral-100">
            <span>${target.date}</span>
            <button onclick="openEditModal(${target.id})" class="text-neutral-800 font-medium hover:underline">수정하기</button>
          </div>
        </div>
      `;

      document.getElementById('detail-modal').classList.remove('hidden');
    };

    window.closeDetailModal = function() {
      document.getElementById('detail-modal').classList.add('hidden');
    };

    window.closeModal = function() {
      document.getElementById('modal').classList.add('hidden');
    };

    // 이미지 처리 로직
    window.processAndPreviewImage = function(file) {
      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressed = canvas.toDataURL('image/jpeg', 0.82);
          document.getElementById('input-imageData').value = compressed;
          setImagePreview(compressed);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    function setImagePreview(src) {
      const preview = document.getElementById('preview-image');
      preview.src = src;
      preview.classList.remove('hidden');
      document.getElementById('upload-placeholder').classList.add('hidden');
    }

    window.handleFileSelect = function(input) {
      if (input.files && input.files[0]) {
        processAndPreviewImage(input.files[0]);
      }
    };

    window.addEventListener('paste', function (e) {
      const modal = document.getElementById('modal');
      if (modal.classList.contains('hidden')) return;

      const items = (e.clipboardData || window.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const file = items[i].getAsFile();
          processAndPreviewImage(file);
          break;
        }
      }
    });

    function getTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }
  </script>
</body>
